name: KIEL CLIENT APK

on: workflow_dispatch: push: paths: - "KIEL_CLIENT_ANDROID_SOURCE.zip" - ".github/workflows/**"

jobs: build: runs-on: ubuntu-latest

steps: - name: Checkout uses: actions/checkout@v4 - name: Install Java uses: actions/setup-java@v4 with: distribution: temurin java-version: "17" - name: Install Android SDK uses: android-actions/setup-android@v3 - name: Accept Android SDK licenses run: yes | sdkmanager --licenses - name: Install SDK packages run: sdkmanager "platforms;android-35" "build-tools;35.0.0" - name: Check source archive run: test -f KIEL_CLIENT_ANDROID_SOURCE.zip - name: Extract source run: unzip -q KIEL_CLIENT_ANDROID_SOURCE.zip -d source - name: Find Gradle project run: find source -name gradlew -type f - name: Build APK run: | cd "$(dirname "$(find source -name gradlew -type f | head -n 1)")" chmod +x gradlew ./gradlew assembleDebug - name: Upload APK uses: actions/upload-artifact@v4 with: name: KIEL-CLIENT-APK path: source/**/build/outputs/apk/debug/*.apk if-no-files-found: error 

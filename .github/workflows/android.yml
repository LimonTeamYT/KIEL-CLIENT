name: KIEL CLIENT APK

on: workflow_dispatch: push: paths: - "KIEL_CLIENT_ANDROID_SOURCE.zip" - ".github/workflows/**"

jobs: build: runs-on: ubuntu-latest

steps: - name: Checkout uses: actions/checkout@v4 - name: Install Java uses: actions/setup-java@v4 with: distribution: temurin java-version: "17" - name: Check source ZIP run: test -f KIEL_CLIENT_ANDROID_SOURCE.zip - name: Extract source run: unzip -q KIEL_CLIENT_ANDROID_SOURCE.zip -d source - name: Find Gradle project run: find source -name gradlew -type f 
